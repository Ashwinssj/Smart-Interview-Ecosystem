[project]
name = "ai-services"
version = "0.0.1"
description = "AI Services for Smart Interview Ecosystem"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.4.0",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.6",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "numpy>=1.26.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"